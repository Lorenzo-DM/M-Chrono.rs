name: Release

on:
  release:
    types: [released]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Sync version from tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not a semver version"; exit 1 ;;
          esac
          jq --arg v "$V" '.version = $v' src-tauri/tauri.conf.json > tmp && mv tmp src-tauri/tauri.conf.json
          jq --arg v "$V" '.version = $v' package.json > tmp && mv tmp package.json
          awk -v v="$V" '!d && /^version = / { print "version = \"" v "\""; d=1; next } 1' \
            src-tauri/Cargo.toml > tmp && mv tmp src-tauri/Cargo.toml
          echo "Building version $V from tag $TAG"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          releaseName: 'M-Chrono ${{ github.event.release.tag_name }}'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
