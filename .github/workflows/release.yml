name: Release

on:
  release:
    types: [released]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Verify version matches tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not a semver version"; exit 1 ;;
          esac

          CONF_V=$(jq -r '.version' src-tauri/tauri.conf.json)
          PKG_V=$(jq -r '.version' package.json)
          CARGO_V=$(awk -F'"' '/^version = /{print $2; exit}' src-tauri/Cargo.toml)

          fail=0
          for entry in "src-tauri/tauri.conf.json:$CONF_V" "package.json:$PKG_V" "src-tauri/Cargo.toml:$CARGO_V"; do
            file="${entry%%:*}"
            v="${entry##*:}"
            if [ "$v" != "$V" ]; then
              echo "::error file=$file::$file declares version $v, but tag $TAG expects $V"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::version manifests disagree with tag $TAG. Bump the version in tauri.conf.json, package.json, and Cargo.toml in a commit before tagging the release, then re-tag."
            exit 1
          fi

          echo "Tag $TAG matches all manifests. Building version $V."

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          releaseName: 'M-Chrono ${{ github.event.release.tag_name }}'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
